{% extends "base.html" %}
{% block title %}Forgot Password — GEX Intelligence{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-2 fw-bold">Reset your password</h4>
        <p class="text-muted small mb-4">
          Enter the email address for your account and we'll send you a link to
          set a new password. The link expires in 1 hour.
        </p>

        <form method="post" action="{{ url_for('auth.forgot_password') }}" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" required autofocus />
          </div>
          <button type="submit" class="btn btn-primary w-100">Send reset link</button>
        </form>

        <p class="text-center text-muted mt-3 mb-0 small">
          Remembered it? <a href="{{ url_for('auth.login') }}">Back to log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
