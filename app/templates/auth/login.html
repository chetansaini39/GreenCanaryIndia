{% extends "base.html" %}
{% block title %}Log In — GEX Intelligence{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-sm-10 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h4 class="card-title mb-4 fw-bold">Log in</h4>

        {# Google OAuth button #}
        <a href="{{ url_for('auth.login_google') }}"
           class="btn btn-outline-dark w-100 mb-3 d-flex align-items-center justify-content-center gap-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
            <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
            <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          </svg>
          Continue with Google
        </a>

        <div class="d-flex align-items-center my-3 text-muted">
          <hr class="flex-grow-1" /><span class="px-2 small">or</span><hr class="flex-grow-1" />
        </div>

        <form method="post" action="{{ url_for('auth.login', next=next) }}" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email"
                   autocomplete="email" required autofocus />
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   autocomplete="current-password" required />
          </div>
          <input type="hidden" name="next" value="{{ next }}" />
          <button type="submit" class="btn btn-primary w-100">Log in</button>
        </form>

        <p class="text-center mt-3 mb-0 small">
          <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
        </p>

        <p class="text-center text-muted mt-3 mb-0 small">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}">Register</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
