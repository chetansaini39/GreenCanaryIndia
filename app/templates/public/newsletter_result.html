{% extends "base.html" %}
{% block title %}Newsletter Signup | GEX Intelligence{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 text-center py-5">
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      <a href="javascript:history.back()" class="btn btn-outline-secondary">Go back</a>
    {% else %}
      <h4>You're subscribed!</h4>
      <p class="text-muted">We'll send you GEX snapshots and market-structure insights.</p>
      <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to home</a>
    {% endif %}
  </div>
</div>
{% endblock %}
